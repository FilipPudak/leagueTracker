name = "league-tracker"
main = "src/index.js"
compatibility_date = "2024-01-01"

[env]
# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "league-tracker"
database_id = "ccf38d5e-1639-4eb3-8447-9f3644127e4b"

[triggers]
# NOTE: Cloudflare counts weekdays 1=Sunday (3=TUE, 4=WED) — abbreviations avoid the trap.
crons = ["15 20,21,22 * * WED", "0 7 * * THU", "15 */2 * * *"]

[vars]
ALLOWED_ORIGIN = "https://filippudak.github.io"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
